name: Web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: daijro/Lemon-Studio-web
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Native fixture dependencies
        if: github.event_name != 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libwayland-dev libclang-dev libjack-jackd2-dev pkg-config pulseaudio
      - uses: Swatinem/rust-cache@v2
      - name: Install web tooling
        run: tools/web-setup.sh
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install Firefox for full checks
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps firefox
      - name: Build fixtures and app with test observations
        if: github.event_name != 'pull_request'
        run: |
          node crates/os-app/web/files.test.mjs
          tools/web-fixtures.sh
          tools/web-build.sh --features web-test
      - name: Start virtual audio output
        if: github.event_name != 'pull_request'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci channels=2 rate=48000
          pactl set-default-sink ci
      - name: Chromium DSP, plugins, editor and files
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          node tools/web-check.mjs dsp
          node tools/web-check.mjs plugins
          node tools/web-check.mjs editor
      - name: Chromium file browser and project round-trip check
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node tools/web-check.mjs files
      - name: Chromium audio playback check
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node tools/web-check.mjs audio
      - name: Firefox browser checks
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          WEB_BROWSER=firefox node tools/web-check.mjs dsp
          WEB_BROWSER=firefox node tools/web-check.mjs plugins
          WEB_BROWSER=firefox node tools/web-check.mjs editor
      - name: Package production app
        run: |
          tools/web-build.sh
          node tools/web-check.mjs package
      - name: Enable cross-origin isolation on GitHub Pages
        run: |
          cat > dist/web/coi-serviceworker.js <<'EOF'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', event => event.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', event => {
            if (event.request.cache === 'only-if-cached' && event.request.mode !== 'same-origin') return;
            event.respondWith((async () => {
              const response = await fetch(event.request);
              const headers = new Headers(response.headers);
              headers.set('Cross-Origin-Opener-Policy', 'same-origin');
              headers.set('Cross-Origin-Embedder-Policy', 'require-corp');
              return new Response(response.body, {
                status: response.status,
                statusText: response.statusText,
                headers
              });
            })());
          });
          EOF
          python3 - <<'PY'
          from pathlib import Path
          path = Path('dist/web/index.html')
          html = path.read_text()
          bootstrap = """<script>
          if (!crossOriginIsolated && 'serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), { once: true });
            navigator.serviceWorker.register('./coi-serviceworker.js').then(registration => {
              if (registration.active && !navigator.serviceWorker.controller) location.reload();
            }).catch(error => {
              document.querySelector('#status').textContent = 'Browser isolation setup failed: ' + error;
            });
          }
          </script>
          """
          html = html.replace('<script type="module"', bootstrap + '<script type="module"', 1)
          path.write_text(html)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lemon-studio-web
          path: dist/lemon-studio-web.zip
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload browser app to Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - name: Deploy browser app
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish web release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_TAG: v0.0.1-web.${{ github.run_number }}
        run: |
          if gh release view "$WEB_TAG" >/dev/null 2>&1; then
            gh release upload "$WEB_TAG" dist/lemon-studio-web.zip --clobber
          else
            gh release create "$WEB_TAG" dist/lemon-studio-web.zip \
              --target "$GITHUB_SHA" --title "Lemon Studio $WEB_TAG" \
              --prerelease --notes-file web/RELEASE.md
          fi
